function renderQuestion(n){const q=QUESTIONS[n];let field='';if(q.type==='radio'||q.type==='scale'){const arr=q.type==='scale'?scaleFor(n):q.options;field=`<div class="${q.type==='scale'?(arr.length===4?'scale four':'scale'):'options'}" role="radiogroup" aria-label="${escapeHtml(q.title)}">`+arr.map((label,i)=>{const value=q.type==='scale'?String(i+1):label;return `<label class="option"><input type="radio" name="q${n}" value="${escapeHtml(value)}" ${String(answers[n]??'')===value?'checked':''}><span>${q.type==='scale'?`${i+1}점 · `:''}${escapeHtml(label)}</span></label>`}).join('')+'</div>';}else if(q.type==='multi'){field='<div class="options">'+q.options.map(label=>`<label class="option"><input type="checkbox" name="q21" value="${escapeHtml(label)}" ${(answers[21]||[]).includes(label)?'checked':''}><span>${escapeHtml(label)}</span></label>`).join('')+'</div><input class="other-input '+((answers[21]||[]).includes('기타')?'':'hidden')+'" id="other" type="text" maxlength="200" placeholder="기타 의견을 입력해 주세요" value="'+escapeHtml(answers.other||'')+'">';}else field=`<textarea id="q${n}" maxlength="2000" placeholder="자유롭게 작성 (선택)">${escapeHtml(answers[n]||'')}</textarea>`;return `<div class="question" data-q="${n}"><p class="question-title"><span class="num">${n}.</span>${escapeHtml(q.title)}${n===21?'<span class="required">*중복 체크 가능</span>':''}</p>${field}${q.hint?`<p class="hint">${escapeHtml(q.hint)}</p>`:''}<div class="error hidden" aria-live="polite">필수 문항에 응답해 주세요.</div></div>`;}

 const ss=steps();stepIndex=Math.min(stepIndex,ss.length-1);const step=ss[stepIndex];$('stepCounter').textContent=`${stepIndex+1} / ${ss.length} 단계`;$('percent').textContent=`${Math.round(stepIndex/(ss.length-1)*100)}%`;$('progress').style.width=`${Math.round(stepIndex/(ss.length-1)*100)}%`;$('status').textContent='';let html=`<div class="stephead" role="heading" aria-level="2">${escapeHtml(step.key==='intro'?'설문 안내':step.name)}</div>`;if(step.key==='intro')html+=`<p class="step-desc">이번 행사를 통해 이전과 비교해 새롭게 알게 된 점과 행사 만족도를 확인하고자 합니다.</p><div class="notice"><strong>응답 안내</strong><br>• 필수 항목은 모두 응답해야 다음 페이지로 이동할 수 있습니다.<br>• 이전 버튼을 눌러 응답을 수정할 수 있습니다.<br>• 참여하지 않은 프로그램의 질문은 표시되지 않으며 선택할 수 없습니다.<br>• 응답은 익명으로 수집합니다.</div><p class="hint"></p>`;else if(step.key==='review'){html+=`<p class="step-desc">제출 전 응답을 확인해 주세요. 수정하려면 ‘이전’을 선택하세요.</p><div class="review">${Object.keys(QUESTIONS).map(Number).filter(n=>(isMorning()||![3,4,5,6,7,8,13,14,15,16,17].includes(n))&&(isAfternoon()||![9,10,11,12].includes(n))).map(n=>{const ans=Array.isArray(answers[n])?answers[n].join(', '):QUESTIONS[n].type==='scale'&&answers[n]!==undefined?`${answers[n]}점 · ${scaleFor(n)[Number(answers[n])-1]}`:answers[n]||'선택 응답 없음';return `<div class="review-item"><div class="review-label">${n}. ${escapeHtml(QUESTIONS[n].title)}</div><div class="review-answer">${escapeHtml(ans)}${n===21&&answers.other?' — '+escapeHtml(answers.other):''}</div></div>`}).join('')}</div><div class="notice" id="submitInfo"></div>`;}else{const descriptions={basic:'소속과 참석 프로그램을 선택하면 해당 프로그램의 설문만 표시됩니다.',morning:'오전 시상식 및 토크콘서트 참여 경험을 평가해 주세요.',afternoon:'오후 레크리에이션 참여 경험을 평가해 주세요.',outcomes:'이번 행사를 통해 자신의 일이 지닌 의미와 중요성을 어떻게 확인했는지 응답해 주세요.',general:'행사 전체 만족도와 향후 운영에 대한 의견을 알려 주세요.'};html+=`<p class="step-desc">${descriptions[step.key]}</p>${step.qs.map(renderQuestion).join('')}`;}$('content').innerHTML=html;$('prev').disabled=stepIndex===0||submitted;$('next').textContent=step.key==='review'?'응답 제출':step.key==='intro'?'설문 시작':'다음';$('next').disabled=submitted;if(step.key==='review')$('submitInfo').textContent=SUBMISSION_ENDPOINT?'제출 버튼을 누르면 응답을 서버로 전송합니다.':'현재는 미리보기 모드입니다. 응답 서버가 연결되지 않아 실제 제출은 불가하며, 아래 버튼으로 시험 응답을 파일로 내려받을 수 있습니다.';if(step.key==='review'&&!SUBMISSION_ENDPOINT){const btn=document.createElement('button');btn.className='btn';btn.type='button';btn.textContent='시험 응답 JSON 내려받기';btn.onclick=()=>{const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SAVE_THE_MOVE_survey_preview.json';a.click();URL.revokeObjectURL(url);};$('submitInfo').append(document.createElement('br'),btn);$('next').disabled=true;}window.scrollTo({top:0,behavior:'instant'});}
function handleInput(event){const e=event.target;if(e.name&&/^q\d+$/.test(e.name)){const n=Number(e.name.slice(1));if(e.type==='checkbox'){answers[n]=[...document.querySelectorAll(`input[name="q${n}"]:checked`)].map(x=>x.value);if(n===21){const o=$('other');o.classList.toggle('hidden',!answers[21].includes('기타'));if(!answers[21].includes('기타')){delete answers.other;o.value='';}}}else if(e.type==='radio'){answers[n]=QUESTIONS[n].type==='scale'?Number(e.value):e.value;if(n===2)cleanIneligible();}const question=e.closest('.question');if(question){question.classList.remove('invalid');question.querySelector('.error')?.classList.add('hidden');}}else if(e.id==='other')answers.other=e.value;else if(e.id==='q20')answers[20]=e.value;}
$('content').addEventListener('input',handleInput);$('content').addEventListener('change',handleInput);
function validate(){const st=steps()[stepIndex];if(!st.qs)return true;let first=null;for(const n of st.qs){const q=QUESTIONS[n],ok=!q.required||answers[n]!==undefined&&answers[n]!==''&&(!Array.isArray(answers[n])||answers[n].length>0);const el=document.querySelector(`[data-q="${n}"]`);el?.classList.toggle('invalid',!ok);el?.querySelector('.error')?.classList.toggle('hidden',ok);if(!ok&&!first)first=el;}if(first){first.scrollIntoView({behavior:'smooth',block:'center'});$('status').textContent='필수 문항에 모두 응답하면 다음 단계로 이동할 수 있습니다.';return false;}return true;}
function buildPayload(){cleanIneligible();const data={schema:'SAVE_THE_MOVE_2026_v2',response_id:RESPONSE_ID,submitted_at:new Date().toISOString(),answers:{}};Object.keys(QUESTIONS).map(Number).forEach(n=>{if(Object.hasOwn(answers,n))data.answers['q'+n]=answers[n]});if(answers.other)data.answers.q21_other=answers.other;return data;}
function confirmSaved(id){
 return new Promise((resolve,reject)=>{
   const callback='surveyAck_'+Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>x.toString(16).padStart(2,'0')).join('');
   const js=document.createElement('script');let finished=false;
   const timeout=setTimeout(()=>end(new Error('저장 확인 시간 초과')),12000);
   function end(err,result){if(finished)return;finished=true;clearTimeout(timeout);delete window[callback];js.remove();err?reject(err):resolve(result);}
   window[callback]=data=>end(null,Boolean(data&&data.ok));
   js.onerror=()=>end(new Error('저장 상태 확인 실패'));
   js.src=SUBMISSION_ENDPOINT+'?id='+encodeURIComponent(id)+'&callback='+encodeURIComponent(callback)+'&_='+Date.now();
   document.head.appendChild(js);
 });
}
async function submit(){
 if (!surveyIsOpen()) { render(); return; }
 if(!SUBMISSION_ENDPOINT)return;
 // [변경 2] 전송 중에는 이전/제출 버튼을 잠가 응답 변경을 막습니다.
 const btn=$('next');btn.disabled=true;$('prev').disabled=true;
 $('status').classList.remove('warning','success');$('status').textContent='응답을 전송하고 저장 여부를 확인하고 있습니다.';
 try {
   // Cross-origin Apps Script POST uses a hidden HTML form. The independent GET receipt verifies storage.
   const target='survey_frame_'+Date.now();
   const iframe=document.createElement('iframe');iframe.name=target;iframe.style.display='none';iframe.title='응답 전송';document.body.appendChild(iframe);
   const form=document.createElement('form');form.method='POST';form.action=SUBMISSION_ENDPOINT;form.target=target;form.style.display='none';
   const field=document.createElement('input');field.type='hidden';field.name='payload';field.value=JSON.stringify(buildPayload());form.appendChild(field);document.body.appendChild(form);
   form.submit();form.remove();
   let ok=false;
   for(let i=0;i<6;i++){
     await new Promise(r=>setTimeout(r,i===0?1600:1800));
     try{if(await confirmSaved(RESPONSE_ID)){ok=true;break;}}catch(err){/* Retry receipt check */}
   }
   iframe.remove();
   if(!ok)throw Error('저장 완료 응답을 확인하지 못했습니다.');
   submitted=true;
   $('content').innerHTML='<div class="stephead">완료</div><h2 class="step-title">설문에 참여해 주셔서 감사합니다.</h2><p>여러분의 응답은 현장 실천을 함께 돌아보고 더 나은 공유회를 준비하는 데 활용하겠습니다.</p>';
   $('prev').style.display='none';btn.style.display='none';$('status').textContent='응답이 정상 접수되었습니다.';$('status').classList.add('success');
 }catch(e){
   $('status').textContent='서버 저장 여부를 확인하지 못했습니다. 동일한 응답으로 다시 제출할 수 있으나, 문제가 반복되면 운영 담당자에게 문의해 주세요. ('+e.message+')';
   $('status').classList.add('warning');btn.disabled=false;$('prev').disabled=false;
 }
}
$('prev').addEventListener('click',()=>{if(!surveyIsOpen()){render();return;}if(stepIndex>0){stepIndex--;render();}});$('next').addEventListener('click',()=>{if(!surveyIsOpen()){render();return;}const st=steps()[stepIndex];if(st.key==='review'){submit();return;}if(!validate())return;stepIndex++;render();});render();setInterval(()=>{if(!surveyIsOpen()||$('percent').textContent==='2026.11.12 · 16:00')render();},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
</script>
