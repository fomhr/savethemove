name: Restore original welcome video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original video
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/kimhoho8601-alt/savethemove/main/assets/savethemove-welcome.mp4" -o assets/savethemove-welcome.mp4
          test "$(wc -c < assets/savethemove-welcome.mp4 | tr -d ' ')" = "9273003"
          echo "4bdce2b536ca4d8f5052045af9f451d757083dadb8ce56a8fe549f6f418c5ae5  assets/savethemove-welcome.mp4" | sha256sum -c -
      - name: Commit exact original video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/savethemove-welcome.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Restore original welcome video"
          git push
